name: Release Please

# Maintains a release pull request on main from Conventional Commits
# (fix → patch, feat → minor, feat! / BREAKING CHANGE → major). Merging that
# pull request creates the tag, the GitHub Release and the CHANGELOG.md entry.
# It only ever runs on main — dev never produces releases. See docs/releases.md.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
